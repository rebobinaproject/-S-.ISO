<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de capas de DVD, Blu-ray, VHS e CD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,500&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#eef0f3;--panel:#fff;--ink:#1b1f27;--mut:#5d6575;--line:#d5d9e0;--ac:#d6246e;--field:#f6f7f9}
@media (prefers-color-scheme:dark){:root{--bg:#14161b;--panel:#1d2027;--ink:#eceef2;--mut:#98a0ae;--line:#2e333d;--ac:#ff5c9a;--field:#14161b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,sans-serif}
h1{font:700 26px/1.1 "Barlow Condensed",sans-serif;margin:0}
header{padding:18px 16px 4px;max-width:1200px;margin:auto}
header p{margin:4px 0 0;color:var(--mut)}
main{max-width:1200px;margin:auto;padding:12px 16px 40px;display:grid;gap:16px}
@media(min-width:900px){main{grid-template-columns:380px 1fr;align-items:start}.stage{position:sticky;top:12px}}
.stage{order:-1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
@media(min-width:900px){.stage{order:0}}
canvas{width:100%;height:auto;display:block;border-radius:4px;background:#888}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
label{display:grid;gap:3px;font-weight:600;font-size:13px}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%}
input[type=color]{padding:2px;height:36px}
textarea{min-height:80px;resize:vertical}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1}.row>button{flex:0 0 auto}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.list{display:grid;gap:4px;max-height:200px;overflow:auto}
.list button{text-align:left;background:var(--field);color:var(--ink);border:1px solid var(--line);font-weight:400}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.thumbs img{height:110px;border-radius:4px;border:2px solid transparent;cursor:pointer}
.thumbs img.on{border-color:var(--ac)}
.msg{color:var(--mut);font-size:13px;margin:0}
summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Gerador de capas</h1>
  <p>DVD, Blu-ray, VHS e arte de CD no tamanho real de impressão (300 dpi).</p>
</header>
<main>
  <section class="stage">
    <canvas id="cv" aria-label="Pré-visualização da capa"></canvas>
    <div class="row" style="margin-top:10px">
      <button id="exp">Baixar PNG</button>
    </div>
    <p class="msg" id="size"></p>
  </section>

  <div style="display:grid;gap:16px">
    <section class="panel">
      <label>Formato
        <select id="fmt">
          <option value="dvd">DVD (273 × 183 mm)</option>
          <option value="bd">Blu-ray (272 × 149 mm)</option>
          <option value="vhs">VHS (233 × 188 mm)</option>
          <option value="cd">Arte de CD (120 × 120 mm)</option>
        </select>
      </label>
      <label>Buscar filme ou série
        <span class="row"><input id="q" type="search" placeholder="Ex.: Matrix"><button id="go">Buscar</button></span>
      </label>
      <div class="list" id="res"></div>
      <p class="msg" id="st"></p>
      <details>
        <summary>Chave da API do TMDB</summary>
        <p class="msg">A busca usa o TMDB. Crie uma chave grátis em themoviedb.org (Configurações › API) e cole aqui. Ela fica salva só neste navegador.</p>
        <input id="key" placeholder="Chave da API (v3)">
      </details>
    </section>

    <section class="panel">
      <strong>Arte da capa</strong>
      <div class="thumbs" id="posters"></div>
      <label>Ou envie sua própria imagem<input id="up" type="file" accept="image/*"></label>
    </section>

    <section class="panel">
      <strong>Textos</strong>
      <label>Título<input id="title"></label>
      <label>Slogan<input id="tag"></label>
      <label>Sinopse<textarea id="ov"></textarea></label>
      <div class="three">
        <label>Ano<input id="year"></label>
        <label>Duração (min)<input id="run"></label>
        <label>Classificação<input id="rate"></label>
      </div>
      <label>Direção<input id="dir"></label>
      <label>Elenco<input id="cast"></label>
    </section>

    <section class="panel">
      <strong>Cores</strong>
      <div class="three">
        <label>Fundo<input type="color" id="bg" value="#14161b"></label>
        <label>Texto<input type="color" id="fg" value="#f2f2f2"></label>
        <label>Destaque<input type="color" id="ac" value="#ff5c9a"></label>
      </div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const FORMATS = { dvd:{w:273,h:183,spine:14}, bd:{w:272,h:149,spine:12}, vhs:{w:233,h:188,spine:25}, cd:{w:120,h:120,spine:0} };
const PX = 300 / 25.4;
const IMG = 'https://image.tmdb.org/t/p/';
const S = { poster:null, studios:[], id:'' };
const cv = $('cv'), ctx = cv.getContext('2d');
const FONT = '"Barlow Condensed","Arial Narrow",sans-serif';

function loadImg(src){
  return new Promise((ok, no) => {
    const i = new Image(); i.crossOrigin = 'anonymous';
    i.onload = () => ok(i); i.onerror = no; i.src = src;
  });
}

function wrap(text, maxW){
  const out = []; let line = '';
  for (const w of text.split(/\s+/)) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
}

function fitText(text, maxW, size, weight){
  let s = size;
  ctx.font = `${weight} ${s}px ${FONT}`;
  while (ctx.measureText(text).width > maxW && s > 2) { s -= .5; ctx.font = `${weight} ${s}px ${FONT}`; }
  return s;
}

function cover(img, x, y, w, h){
  const r = Math.max(w / img.width, h / img.height);
  const dw = img.width * r, dh = img.height * r;
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  ctx.restore();
}

function draw(){
  const f = FORMATS[$('fmt').value];
  cv.width = Math.round(f.w * PX); cv.height = Math.round(f.h * PX);
  $('size').textContent = `${cv.width} × ${cv.height} px`;
  ctx.setTransform(PX, 0, 0, PX, 0, 0);
  const bg = $('bg').value, fg = $('fg').value, ac = $('ac').value;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, f.w, f.h);

  const single = f.spine === 0;
  const fw = single ? f.w : (f.w - f.spine) / 2;
  const fx = single ? 0 : fw + f.spine;
  const title = $('title').value || 'Título do filme';

  // frente
  if (S.poster) cover(S.poster, fx, 0, fw, f.h);
  const g = ctx.createLinearGradient(0, f.h * .55, 0, f.h);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.8)');
  ctx.fillStyle = g; ctx.fillRect(fx, f.h * .55, fw, f.h * .45);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const ts = fitText(title.toUpperCase(), fw - 14, f.h * .09, 700);
  ctx.fillText(title.toUpperCase(), fx + fw / 2, f.h - 10);
  ctx.fillStyle = ac; ctx.fillRect(fx + fw / 2 - 10, f.h - 8, 20, .8);

  if (single) return;

  // lombada
  ctx.save();
  ctx.translate(fw + f.spine / 2, f.h / 2); ctx.rotate(Math.PI / 2);
  ctx.fillStyle = fg; ctx.textBaseline = 'middle';
  const ss = fitText(title.toUpperCase(), f.h - 40, f.spine * .55, 700);
  ctx.textAlign = 'center'; ctx.fillText(title.toUpperCase(), 0, 0);
  ctx.fillStyle = ac; ctx.textAlign = 'left'; ctx.font = `600 ${f.spine * .3}px ${FONT}`;
  ctx.fillText($('year').value, -(f.h / 2) + 8, 0);
  ctx.restore();

  // verso
  const m = 9, bw = fw - m * 2; let y = m + 4;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if ($('tag').value) {
    ctx.fillStyle = ac; ctx.font = `italic 500 ${f.h * .035}px ${FONT}`;
    for (const l of wrap($('tag').value, bw)) { ctx.fillText(l, m, y); y += f.h * .04; }
    y += 3;
  }
  ctx.fillStyle = fg; const fs = f.h * .024; ctx.font = `600 ${fs}px ${FONT}`;
  for (const l of wrap($('ov').value, bw)) { if (y > f.h * .6) break; ctx.fillText(l, m, y); y += fs * 1.3; }
  y += 4;
  ctx.fillStyle = ac; ctx.fillRect(m, y, bw, .4); y += 5;
  ctx.fillStyle = fg; ctx.font = `600 ${fs * .9}px ${FONT}`;
  const meta = [$('year').value, $('run').value && $('run').value + ' min', $('rate').value].filter(Boolean).join('   |   ');
  if (meta) { ctx.fillText(meta, m, y); y += fs * 1.4; }
  if ($('dir').value) for (const l of wrap('Direção: ' + $('dir').value, bw)) { ctx.fillText(l, m, y); y += fs * 1.2; }
  if ($('cast').value) for (const l of wrap('Elenco: ' + $('cast').value, bw)) { ctx.fillText(l, m, y); y += fs * 1.2; }

  // estúdios
  let sx = m; const sy = f.h - m - 9;
  for (const im of S.studios) {
    const h = 8, w = Math.min(im.width / im.height * h, 28);
    ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fillRect(sx - 1.5, sy - 1.5, w + 3, h + 3);
    ctx.drawImage(im, sx, sy, w, h); sx += w + 6;
  }
  // código de barras decorativo
  let seed = 0; for (const ch of (S.id || title)) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const bx = fw - m - 28, by = f.h - m - 14;
  ctx.fillStyle = '#fff'; ctx.fillRect(bx - 2, by - 2, 30, 16);
  ctx.fillStyle = '#000'; let bxx = bx;
  for (let i = 0; i < 30; i++) { seed = (seed * 1664525 + 1013904223) >>> 0; const bwid = .4 + (seed % 3) * .3; ctx.fillRect(bxx, by, bwid, 12); bxx += bwid + .4 + (seed >> 8) % 2 * .3; if (bxx > bx + 26) break; }
}

// ---------- TMDB ----------
const keyEl = $('key');
keyEl.value = localStorage.getItem('tmdbKey') || '';
keyEl.addEventListener('change', () => { try { localStorage.setItem('tmdbKey', keyEl.value.trim()); } catch (e) {} });
const st = t => $('st').textContent = t;

async function tmdb(path, params = {}){
  const key = keyEl.value.trim();
  if (!key) { st('Cole sua chave do TMDB na seção abaixo para buscar.'); $('key').closest('details').open = true; throw new Error('sem chave'); }
  const u = new URL('https://api.themoviedb.org/3' + path);
  u.search = new URLSearchParams({ api_key: key, language: 'pt-BR', ...params });
  const r = await fetch(u); if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function search(){
  const q = $('q').value.trim(); if (!q) return;
  st('Buscando…'); $('res').replaceChildren();
  try {
    const d = await tmdb('/search/multi', { query: q });
    const items = d.results.filter(r => r.media_type !== 'person').slice(0, 10);
    if (!items.length) return st('Nada encontrado. Tente outro título.');
    st('');
    for (const it of items) {
      const b = document.createElement('button');
      b.textContent = `${it.title || it.name} (${(it.release_date || it.first_air_date || '').slice(0, 4) || '—'})`;
      b.onclick = () => pick(it);
      $('res').appendChild(b);
    }
  } catch (e) { if (e.message !== 'sem chave') st('Erro na busca. Confira a chave e tente de novo.'); }
}

async function pick(it){
  st('Carregando dados…');
  try {
    const t = it.media_type === 'tv' ? 'tv' : 'movie';
    const d = await tmdb(`/${t}/${it.id}`, { append_to_response: 'credits,images', include_image_language: 'pt,en,null' });
    S.id = String(it.id);
    $('title').value = d.title || d.name || '';
    $('tag').value = d.tagline || '';
    $('ov').value = d.overview || '';
    $('year').value = (d.release_date || d.first_air_date || '').slice(0, 4);
    $('run').value = d.runtime || (d.episode_run_time && d.episode_run_time[0]) || '';
    const crew = d.credits ? d.credits.crew : [];
    $('dir').value = crew.filter(c => c.job === 'Director').map(c => c.name).join(', ') || (d.created_by || []).map(c => c.name).join(', ');
    $('cast').value = (d.credits ? d.credits.cast : []).slice(0, 6).map(c => c.name).join(', ');
    const posters = (d.images.posters || []).slice(0, 14).map(p => p.file_path);
    if (d.poster_path && !posters.includes(d.poster_path)) posters.unshift(d.poster_path);
    showPosters(posters);
    if (posters[0]) usePoster(posters[0]);
    S.studios = [];
    const logos = (d.production_companies || []).filter(c => c.logo_path).slice(0, 3);
    for (const c of logos) { try { S.studios.push(await loadImg(IMG + 'w300' + c.logo_path)); } catch (e) {} }
    st(''); draw();
  } catch (e) { st('Não foi possível carregar este título.'); }
}

function showPosters(list){
  const box = $('posters'); box.replaceChildren();
  for (const p of list) {
    const im = document.createElement('img'); im.src = IMG + 'w185' + p; im.alt = 'Opção de pôster'; im.loading = 'lazy';
    im.onclick = () => { usePoster(p); [...box.children].forEach(c => c.classList.toggle('on', c === im)); };
    box.appendChild(im);
  }
  if (box.firstChild) box.firstChild.classList.add('on');
}

async function usePoster(p){
  try { S.poster = await loadImg(IMG + 'w780' + p); draw(); } catch (e) { st('Não foi possível carregar este pôster.'); }
}

// ---------- eventos ----------
$('go').onclick = search;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
$('up').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  loadImg(url).then(im => { S.poster = im; draw(); });
};
document.querySelectorAll('input:not([type=file]):not(#q):not(#key),select,textarea').forEach(el => el.addEventListener('input', () => requestAnimationFrame(draw)));
$('exp').onclick = () => cv.toBlob(b => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(b);
  a.download = `${($('title').value || 'capa').replace(/[^\w-]+/g, '-')}-${$('fmt').value}.png`; a.click();
}, 'image/png');

draw();
Promise.all([document.fonts.load(`700 20px "Barlow Condensed"`), document.fonts.load(`600 20px "Barlow Condensed"`), document.fonts.load(`italic 500 20px "Barlow Condensed"`)]).then(draw).catch(() => {});
</script>
</body>
</html>
